[graph]
targets = ["x86_64-pc-windows-msvc", "wasm32-unknown-unknown"]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Workspace-only path dependencies have no registry version. The independent
# supply-chain verifier still rejects literal "*" manifest versions.
wildcards = "allow"
deny = [{ name = "openssl-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
