[package]
name = "pal-save-parser-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[[bin]]
name = "pal-save-parser-worker"
path = "src/main.rs"

[dependencies]
pal-save-ingest = { path = "../../crates/pal-save-ingest" }
psp-core = { git = "https://github.com/oMaN-Rod/palworld-save-pal.git", rev = "d9ccf27a56fbcf6cc538ca37c1e713417a10e925", package = "psp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[workspace]
