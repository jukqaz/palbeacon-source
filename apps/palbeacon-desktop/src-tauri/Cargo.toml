[package]
name = "palbeacon-desktop"
version = "0.1.0"
description = "PalBeacon Windows shell"
authors = ["PalBeacon contributors"]
edition = "2024"
rust-version = "1.97"
publish = false

[package.metadata.cargo-machete]
ignored = ["tauri-build"] # Used by build.rs; cargo-machete does not inspect build scripts.

[lib]
name = "palbeacon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
log = "0.4"
pal-app-settings = { path = "../../../crates/pal-app-settings" }
pal-build-contract = { path = "../../../crates/pal-build-contract" }
pal-overlay-control = { path = "../../../crates/pal-overlay-control" }
pal-rest = { path = "../../../crates/pal-rest" }
pal-save-ingest = { path = "../../../crates/pal-save-ingest" }
pal-sftp-sync = { path = "../../../crates/pal-sftp-sync" }
pal-windows-ipc = { path = "../../../crates/pal-windows-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.4.1"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
ts-rs = "=12.0.1"

[workspace]
