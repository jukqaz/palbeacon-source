syntax = "proto3";

package palcompanion.v1;

enum SnapshotCompleteness {
  SNAPSHOT_COMPLETENESS_UNSPECIFIED = 0;
  SNAPSHOT_COMPLETENESS_COMPLETE = 1;
  SNAPSHOT_COMPLETENESS_PARTIAL = 2;
  SNAPSHOT_COMPLETENESS_UNAVAILABLE = 3;
  SNAPSHOT_COMPLETENESS_UNKNOWN = 4;
}

enum SnapshotSectionKind {
  SNAPSHOT_SECTION_KIND_UNSPECIFIED = 0;
  SNAPSHOT_SECTION_KIND_CHARACTER = 1;
  SNAPSHOT_SECTION_KIND_INVENTORY = 2;
  SNAPSHOT_SECTION_KIND_EQUIPMENT = 3;
  SNAPSHOT_SECTION_KIND_PALS = 4;
  SNAPSHOT_SECTION_KIND_BASES = 5;
  SNAPSHOT_SECTION_KIND_PROGRESSION = 6;
}

enum InventoryContainerKind {
  INVENTORY_CONTAINER_KIND_UNSPECIFIED = 0;
  INVENTORY_CONTAINER_KIND_CHARACTER = 1;
  INVENTORY_CONTAINER_KIND_PALDECK = 2;
  INVENTORY_CONTAINER_KIND_BASE = 3;
}

enum EquipmentSlotKind {
  EQUIPMENT_SLOT_KIND_UNSPECIFIED = 0;
  EQUIPMENT_SLOT_KIND_WEAPON = 1;
  EQUIPMENT_SLOT_KIND_HELMET = 2;
  EQUIPMENT_SLOT_KIND_ARMOR = 3;
  EQUIPMENT_SLOT_KIND_GLIDER = 4;
  EQUIPMENT_SLOT_KIND_ACCESSORY = 5;
}

enum PalGender {
  PAL_GENDER_UNSPECIFIED = 0;
  PAL_GENDER_MALE = 1;
  PAL_GENDER_FEMALE = 2;
  PAL_GENDER_GENDERLESS = 3;
}

enum PalContainerKind {
  PAL_CONTAINER_KIND_UNSPECIFIED = 0;
  PAL_CONTAINER_KIND_PARTY = 1;
  PAL_CONTAINER_KIND_PALBOX = 2;
  PAL_CONTAINER_KIND_BASE = 3;
  PAL_CONTAINER_KIND_VIEWING_CAGE = 4;
}

enum SaveSourceRole {
  SAVE_SOURCE_ROLE_UNSPECIFIED = 0;
  SAVE_SOURCE_ROLE_LEVEL = 1;
  SAVE_SOURCE_ROLE_LEVEL_META = 2;
  SAVE_SOURCE_ROLE_PLAYER = 3;
  SAVE_SOURCE_ROLE_WORLD_OPTION = 4;
}

message PalLocation {
  PalContainerKind container_kind = 1;
  uint32 container_ordinal = 2;
  uint32 slot_index = 3;
  optional bytes base_id = 4;
}

message CharacterProfile {
  uint32 level = 1;
  uint64 experience = 2;
  uint32 allocated_hp = 3;
  uint32 allocated_stamina = 4;
  uint32 allocated_attack = 5;
  uint32 allocated_defense = 6;
  uint32 allocated_work_speed = 7;
  uint32 allocated_carry_weight = 8;
  uint32 technology_points = 9;
  uint32 ancient_technology_points = 10;
  optional bytes world_subject_id = 11;
  optional bytes player_subject_id = 12;
}

message InventorySlot {
  InventoryContainerKind container_kind = 1;
  uint32 container_ordinal = 2;
  uint32 slot_index = 3;
  string item_id = 4;
  uint64 quantity = 5;
  optional uint32 durability = 6;
  optional uint32 rarity = 7;
}

message EquipmentSlot {
  EquipmentSlotKind slot_kind = 1;
  uint32 slot_index = 2;
  string item_id = 3;
  optional uint32 durability = 4;
  optional uint32 rarity = 5;
  optional uint64 ammunition = 6;
}

message OwnedPal {
  bytes instance_id = 1;
  string species_id = 2;
  uint32 container_ordinal = 3;
  uint32 level = 4;
  optional uint32 iv_hp = 5;
  optional uint32 iv_attack = 6;
  optional uint32 iv_defense = 7;
  repeated string passive_ids = 8;
  repeated string active_skill_ids = 9;
  PalLocation location = 10;
  optional string gender = 11;
  uint32 condensation_rank = 12;
  repeated string learned_skill_ids = 13;
  uint32 soul_hp = 14;
  uint32 soul_attack = 15;
  uint32 soul_defense = 16;
  uint32 soul_work_speed = 17;
  uint32 trust = 18;
  bool is_lucky = 19;
  bool is_boss = 20;
  bool is_alpha = 21;
  bool is_awakened = 22;
  bool is_mutated = 23;
  uint32 slot_index = 24;
  optional bytes base_id = 25;
}

message BaseFacility {
  string building_id = 1;
  uint32 count = 2;
}

message BaseStorageItem {
  string item_id = 1;
  uint64 quantity = 2;
}

message BaseSnapshot {
  bytes base_id = 1;
  string location_id = 2;
  uint32 level = 3;
  repeated BaseFacility facilities = 4;
  repeated bytes assigned_pal_instance_ids = 5;
  repeated BaseStorageItem storage_items = 6;
}

message ProgressionUnlock {
  string unlock_id = 1;
}

message ProgressionSnapshot {
  repeated string technology_ids = 1;
  repeated string fast_travel_ids = 2;
  repeated string tower_ids = 3;
  repeated string boss_ids = 4;
  repeated string mission_ids = 5;
  repeated string paldex_capture_ids = 6;
  repeated string map_region_ids = 7;
  repeated string collectible_ids = 8;
  repeated string base_research_ids = 9;
}

message SnapshotSectionState {
  SnapshotSectionKind section = 1;
  SnapshotCompleteness completeness = 2;
  uint32 expected_record_count = 3;
  uint32 observed_record_count = 4;
}

message SnapshotDiagnostic {
  string code = 1;
  SnapshotSectionKind section = 2;
}

message PersonalSnapshotContent {
  uint32 schema_major = 1;
  string game_build_id = 2;
  bytes dataset_manifest_id = 3;
  string world_id = 4;
  bytes owner_subject_id = 5;
  SnapshotCompleteness completeness = 6;
  CharacterProfile character = 7;
  repeated InventorySlot inventory = 8;
  repeated EquipmentSlot equipment = 9;
  repeated OwnedPal pals = 10;
  repeated BaseSnapshot bases = 11;
  ProgressionSnapshot progression = 12;
  repeated SnapshotSectionState section_states = 13;
}

message SnapshotCapture {
  PersonalSnapshotContent content = 1;
  bytes personal_snapshot_id = 2;
  uint64 observed_at_unix_ms = 3;
  uint64 source_sequence = 4;
  string parser_revision = 5;
  repeated SnapshotDiagnostic diagnostics = 6;
}

message SaveInputFile {
  SaveSourceRole role = 1;
  string relative_path = 2;
  uint64 encoded_length = 3;
  bytes sha256 = 4;
}

message ParseSaveRequest {
  uint32 schema_major = 1;
  string game_build_id = 2;
  bytes source_install_id = 3;
  string world_id = 4;
  bytes owner_subject_id = 5;
  repeated SaveInputFile files = 6;
}

message NormalizedSaveSet {
  uint32 schema_major = 1;
  string game_build_id = 2;
  bytes source_install_id = 3;
  string world_id = 4;
  bytes owner_subject_id = 5;
  CharacterProfile character = 6;
  repeated InventorySlot inventory = 7;
  repeated EquipmentSlot equipment = 8;
  repeated OwnedPal pals = 9;
  repeated BaseSnapshot bases = 10;
  ProgressionSnapshot progression = 11;
  repeated SaveSourceRole required_roles_seen = 12;
}

message ContainerCount {
  InventoryContainerKind container_kind = 1;
  uint32 container_ordinal = 2;
  uint32 record_count = 3;
}

message KindCount {
  string kind_id = 1;
  uint32 record_count = 2;
}

message SaveCensus {
  uint32 schema_major = 1;
  uint32 character_count = 2;
  repeated ContainerCount inventory_counts = 3;
  uint32 equipment_count = 4;
  uint32 owned_pal_count = 5;
  repeated bytes owned_pal_instance_ids = 6;
  uint32 base_count = 7;
  uint32 facility_count = 8;
  repeated KindCount progression_counts = 9;
  repeated SaveSourceRole required_roles_seen = 10;
  uint32 base_assigned_pal_count = 11;
  uint32 base_storage_slot_count = 12;
}
