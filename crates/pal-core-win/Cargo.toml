[package]
name = "pal-core-win"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pal-domain = { path = "../pal-domain" }
pal-map-pack-store = { path = "../pal-map-pack-store" }
pal-overlay-control = { path = "../pal-overlay-control" }
pal-protocol = { path = "../pal-protocol" }
pal-windows-ipc = { path = "../pal-windows-ipc" }
thiserror.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"

[[bin]]
name = "pal-core"
path = "src/main.rs"
