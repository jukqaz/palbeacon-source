version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "03:00"
      timezone: Asia/Seoul
    # Final maintenance: security updates stay enabled; routine version PRs do not.
    open-pull-requests-limit: 0
    groups:
      javascript-security:
        applies-to: security-updates
        patterns:
          - "*"
      javascript-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      javascript-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "03:15"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
    groups:
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
      rust-workspace:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /apps/palbeacon-desktop/src-tauri
    schedule:
      interval: monthly
      time: "03:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
    groups:
      tauri-security:
        applies-to: security-updates
        patterns:
          - "*"
      tauri-rust:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "03:45"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions:
        patterns:
          - "*"
